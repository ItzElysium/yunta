name: APK Android

# Compila las dos apps Android y las publica en Releases (etiqueta "apk"):
#   yunta.apk         -> la app Yunta (abre https://itzelysium.github.io/yunta/, con cámara)
#   yunta-cobros.apk  -> Yunta Cobros (solo para el celular de la empresa que recibe Yape/Plin)
# El proyecto lo arma android-build.sh con los archivos android-*.java del repositorio.
# Se ejecuta al cambiar esos archivos o a mano: Actions -> APK Android -> Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android.yml', 'android-build.sh', 'android-*.java']

permissions:
  contents: write

env:
  APP_URL: https://itzelysium.github.io/yunta/
  APP_HOST: itzelysium.github.io
  VERSION_NAME: "1.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar firma (opcional)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > $RUNNER_TEMP/yunta.jks
            echo "KS_PATH=$RUNNER_TEMP/yunta.jks" >> $GITHUB_ENV
          fi

      - name: Compilar las dos apps
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -e
          chmod +x android-build.sh
          for app in yunta cobros; do
            ./android-build.sh $app
            (cd build-$app && gradle assembleRelease --no-daemon)
          done
          cp build-yunta/build/outputs/apk/release/*.apk yunta.apk
          cp build-cobros/build/outputs/apk/release/*.apk yunta-cobros.apk
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yunta-apks
          path: '*.apk'

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk yunta.apk yunta-cobros.apk \
            --title "Yunta para Android (versión ${{ env.VERSION_NAME }}.${{ github.run_number }})" \
            --notes "yunta.apk: la app para todos (necesita cámara para el escaneo de rostro). yunta-cobros.apk: SOLO para el celular de la empresa que recibe los Yape y Plin. Para instalar, abre el archivo en tu Android y permite 'Instalar apps de origen desconocido' para tu navegador."
