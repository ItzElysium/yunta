name: APK Android

# Compila la app Android de Yunta (carga https://itzelysium.github.io/yunta/)
# y la publica en Releases como "yunta.apk".
# Se ejecuta al cambiar este archivo o a mano desde la pestaña Actions → APK Android → Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android.yml']

permissions:
  contents: write

env:
  APP_URL: https://itzelysium.github.io/yunta/
  APP_HOST: itzelysium.github.io
  VERSION_NAME: "1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Crear proyecto Android
        run: |
          set -e
          mkdir -p app && cd app
          P=src/main
          mkdir -p $P/java/pe/yunta/app $P/res/values $P/res/drawable $P/res/mipmap-anydpi-v26

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'Yunta'
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=false
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > build.gradle <<EOF
          plugins { id 'com.android.application' version '8.5.2' }
          android {
            namespace 'pe.yunta.app'
            compileSdk 34
            defaultConfig {
              applicationId 'pe.yunta.app'
              minSdk 26
              targetSdk 34
              versionCode ${{ github.run_number }}
              versionName '${VERSION_NAME}.${{ github.run_number }}'
              buildConfigField 'String', 'APP_URL', '"${APP_URL}"'
              buildConfigField 'String', 'APP_HOST', '"${APP_HOST}"'
            }
            buildFeatures { buildConfig true }
            signingConfigs {
              if (System.getenv('KS_PATH')) {
                release {
                  storeFile file(System.getenv('KS_PATH'))
                  storePassword System.getenv('KS_PASS')
                  keyAlias System.getenv('KS_ALIAS')
                  keyPassword System.getenv('KS_PASS')
                }
              }
            }
            buildTypes {
              release {
                minifyEnabled false
                signingConfig System.getenv('KS_PATH') ? signingConfigs.release : signingConfigs.debug
              }
            }
          }
          EOF

          cat > $P/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
              android:label="Yunta"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher"
              android:theme="@style/Yunta"
              android:usesCleartextTraffic="false"
              android:supportsRtl="true">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode"
                android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > $P/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="morado">#4B2170</color>
            <color name="aji">#F2B705</color>
            <style name="Yunta" parent="android:Theme.Material.Light.NoActionBar">
              <item name="android:statusBarColor">@color/morado</item>
              <item name="android:navigationBarColor">#FFFFFF</item>
              <item name="android:windowBackground">@color/morado</item>
              <item name="android:colorAccent">@color/aji</item>
            </style>
          </resources>
          EOF

          # Ícono: círculo amarillo ají + punto rojo sobre fondo morado
          cat > $P/res/drawable/ic_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <solid android:color="#4B2170" />
          </shape>
          EOF
          cat > $P/res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#F2B705" android:pathData="M54,54m-17,0a17,17 0,1 1,34 0a17,17 0,1 1,-34 0" />
            <path android:fillColor="#D94B32" android:pathData="M69,40m-8,0a8,8 0,1 1,16 0a8,8 0,1 1,-16 0" />
          </vector>
          EOF
          cat > $P/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_bg" />
            <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF

          cat > $P/java/pe/yunta/app/MainActivity.java <<'EOF'
          package pe.yunta.app;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private static final int FILE_REQ = 41;
            private WebView web;
            private ValueCallback<Uri[]> fileCb;

            @Override
            protected void onCreate(Bundle saved) {
              super.onCreate(saved);
              web = new WebView(this);
              web.setBackgroundColor(Color.parseColor("#FAF7F3"));
              setContentView(web);

              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(true);
              s.setUserAgentString(s.getUserAgentString() + " YuntaApp/" + BuildConfig.VERSION_NAME);
              CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);

              web.setWebViewClient(new WebViewClient() {
                @Override
                public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest req) {
                  Uri u = req.getUrl();
                  String scheme = u.getScheme() == null ? "" : u.getScheme();
                  if (scheme.startsWith("http") && BuildConfig.APP_HOST.equals(u.getHost())) return false;
                  if (scheme.startsWith("http") && u.getHost() != null && u.getHost().endsWith("supabase.co")) return false;
                  openExternal(u);
                  return true;
                }
                @Override
                public void onReceivedError(WebView v, WebResourceRequest req, WebResourceError err) {
                  if (!req.isForMainFrame()) return;
                  String html = "<html><body style='font-family:sans-serif;background:#4B2170;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:90vh;text-align:center;padding:24px'>"
                    + "<h1 style='font-size:28px'>Sin conexión</h1><p>Revisa tu internet y vuelve a intentar.</p>"
                    + "<a href='" + BuildConfig.APP_URL + "' style='background:#F2B705;color:#3E2D00;padding:14px 22px;border-radius:14px;font-weight:bold;text-decoration:none'>Reintentar</a></body></html>";
                  v.loadDataWithBaseURL(BuildConfig.APP_URL, html, "text/html", "utf-8", null);
                }
              });

              web.setWebChromeClient(new WebChromeClient() {
                @Override
                public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams params) {
                  if (fileCb != null) fileCb.onReceiveValue(null);
                  fileCb = cb;
                  try {
                    startActivityForResult(params.createIntent(), FILE_REQ);
                  } catch (ActivityNotFoundException e) {
                    fileCb = null;
                    return false;
                  }
                  return true;
                }
              });

              if (saved != null) web.restoreState(saved);
              else web.loadUrl(BuildConfig.APP_URL);
            }

            private void openExternal(Uri u) {
              try {
                Intent i = "intent".equals(u.getScheme())
                  ? Intent.parseUri(u.toString(), Intent.URI_INTENT_SCHEME)
                  : new Intent(Intent.ACTION_VIEW, u);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                startActivity(i);
              } catch (Exception ignored) { }
            }

            @Override
            protected void onActivityResult(int req, int res, Intent data) {
              if (req == FILE_REQ && fileCb != null) {
                fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                fileCb = null;
                return;
              }
              super.onActivityResult(req, res, data);
            }

            @Override
            protected void onSaveInstanceState(Bundle out) {
              super.onSaveInstanceState(out);
              web.saveState(out);
            }

            @Override
            public void onBackPressed() {
              if (web.canGoBack()) web.goBack();
              else super.onBackPressed();
            }
          }
          EOF

      - name: Preparar firma (opcional)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > $RUNNER_TEMP/yunta.jks
            echo "KS_PATH=$RUNNER_TEMP/yunta.jks" >> $GITHUB_ENV
          fi

      - name: Compilar APK
        working-directory: app
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          gradle assembleRelease --no-daemon
          cp build/outputs/apk/release/*.apk ../yunta.apk
          ls -la ../yunta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yunta-apk
          path: yunta.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk yunta.apk \
            --title "Yunta para Android (versión ${{ env.VERSION_NAME }}.${{ github.run_number }})" \
            --notes "Descarga yunta.apk en tu celular Android y ábrelo. Si te pide permiso, activa 'Instalar apps de origen desconocido' para tu navegador. La app carga ${{ env.APP_URL }}, así que los cambios del sitio se ven sin reinstalar."
