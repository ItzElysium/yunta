<title>Yunta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de una columna (máx. 1180px). Barra superior fija; en celular, navegación abajo.
   Identidad: morado chicha + amarillo ají; cada categoría con su color propio. */
:root{
  --bg:#FAF7F3; --surface:#FFFFFF; --sunk:#F1EBE4; --line:#E6DED4; --fg:#20172A; --muted:#6C6175;
  --morado:#5A2A82; --morado-2:#7B3FB0; --morado-soft:#F0E7F8; --on-morado:#FFFFFF;
  --aji:#F2B705; --aji-ink:#3E2D00; --aji-soft:#FFF3C9;
  --c-compania:#D94B32; --c-compania-soft:#FCE6E0;
  --c-tutoria:#2C64D6;  --c-tutoria-soft:#E3ECFC;
  --c-salud:#13886A;    --c-salud-soft:#DDF3EC;
  --c-hogar:#B97300;    --c-hogar-soft:#FBEBCF;
  --ok:#1F7A4D; --ok-soft:#E2F3EA; --warn:#9A5B00; --warn-soft:#FCEFD6; --bad:#B3261E; --bad-soft:#FBE3E1;
  --gold-1:#F7D35C; --gold-2:#C9900C; --scrim:rgba(24,12,34,.55); --shadow:0 10px 30px rgba(40,20,60,.10);
  --online:#22B36B; --hero-bg:#4B2170; --hero-bg-2:#6E35A0; --hero-fg:#FFFFFF; --hero-muted:rgba(255,255,255,.84); --pill-bg:#FFFFFF; --pill-fg:#20172A; --pill-sunk:#F1EBE4;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141019; --surface:#1E1826; --sunk:#29212F; --line:#382E42; --fg:#F4EFF7; --muted:#B4A8BD;
  --morado:#C9A2EC; --morado-2:#A97BD6; --morado-soft:#33244A; --on-morado:#1A0F24;
  --aji:#F5C431; --aji-ink:#2A1F00; --aji-soft:#3A2F10;
  --c-compania:#FF8C74; --c-compania-soft:#3A221D; --c-tutoria:#8CB2FF; --c-tutoria-soft:#1D2840;
  --c-salud:#5FD3AE; --c-salud-soft:#173229; --c-hogar:#F2B54C; --c-hogar-soft:#3A2B12;
  --ok:#6FD3A0; --ok-soft:#1D3328; --warn:#F2B866; --warn-soft:#3A2C15; --bad:#FF9C94; --bad-soft:#3D1F1D;
  --scrim:rgba(0,0,0,.65); --shadow:0 10px 30px rgba(0,0,0,.35); --hero-bg:#2E1645; --hero-bg-2:#4B2170; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141019; --surface:#1E1826; --sunk:#29212F; --line:#382E42; --fg:#F4EFF7; --muted:#B4A8BD;
  --morado:#C9A2EC; --morado-2:#A97BD6; --morado-soft:#33244A; --on-morado:#1A0F24;
  --aji:#F5C431; --aji-ink:#2A1F00; --aji-soft:#3A2F10;
  --c-compania:#FF8C74; --c-compania-soft:#3A221D; --c-tutoria:#8CB2FF; --c-tutoria-soft:#1D2840;
  --c-salud:#5FD3AE; --c-salud-soft:#173229; --c-hogar:#F2B54C; --c-hogar-soft:#3A2B12;
  --ok:#6FD3A0; --ok-soft:#1D3328; --warn:#F2B866; --warn-soft:#3A2C15; --bad:#FF9C94; --bad-soft:#3D1F1D;
  --scrim:rgba(0,0,0,.65); --shadow:0 10px 30px rgba(0,0,0,.35); --hero-bg:#2E1645; --hero-bg-2:#4B2170; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.1;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--morado);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;vertical-align:middle}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[data-cat="compania"]{--c:var(--c-compania);--cs:var(--c-compania-soft)}
[data-cat="tutoria"]{--c:var(--c-tutoria);--cs:var(--c-tutoria-soft)}
[data-cat="salud"]{--c:var(--c-salud);--cs:var(--c-salud-soft)}
[data-cat="hogar"]{--c:var(--c-hogar);--cs:var(--c-hogar-soft)}

/* ---------- Barra superior ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{font-family:var(--font-display);font-weight:800;font-size:25px;color:var(--morado);letter-spacing:-.03em;display:flex;align-items:center;gap:7px;background:none;border:0;padding:0}
.logo i{width:13px;height:13px;border-radius:50%;background:var(--aji);box-shadow:5px -5px 0 -2px var(--c-compania)}
.tag-demo{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--aji);color:var(--aji-ink);padding:3px 7px;border-radius:99px}
nav.tabs{margin-left:auto;display:flex;gap:2px;align-items:center}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:7px;position:relative}
nav.tabs button[aria-current="true"]{color:var(--morado);background:var(--morado-soft)}
nav.tabs .dot{position:absolute;top:4px;right:6px;min-width:17px;height:17px;border-radius:99px;background:var(--c-compania);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.wallet{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px 5px 6px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.wallet .k{width:24px;height:24px;border-radius:50%;background:var(--aji);color:var(--aji-ink);display:grid;place-items:center}
.wallet .k svg{width:14px;height:14px}
.me{width:30px;height:30px;border-radius:50%;overflow:hidden;display:inline-block;flex:none}

main{padding-block:20px 120px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 12px}
.section-h h2{font-size:22px}
.section-h small{color:var(--muted)}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:34px 30px 28px;background:linear-gradient(135deg,var(--hero-bg),var(--hero-bg-2));color:var(--hero-fg);isolation:isolate}
.hero::before{content:"";position:absolute;inset:-40% -10% auto auto;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,var(--aji) 0 30%,transparent 31%),radial-gradient(circle at 70% 70%,var(--c-compania) 0 22%,transparent 23%);opacity:.9;z-index:-1;filter:saturate(1.1)}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 2px,transparent 2px 14px);z-index:-1}
.hero h1{font-size:clamp(34px,6vw,62px);font-weight:800;max-width:14ch;color:var(--hero-fg)}
.rot{display:inline-block;color:var(--aji);min-width:4ch}
.rot span{display:inline-block;animation:rot-in .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rot-in{from{transform:translateY(60%);opacity:0}}
.hero p{max-width:46ch;margin:14px 0 20px;color:var(--hero-muted);font-size:16px}
.search{display:flex;gap:8px;background:var(--pill-bg);color:var(--pill-fg);border-radius:99px;padding:6px;max-width:640px;box-shadow:0 12px 40px rgba(0,0,0,.25);flex-wrap:wrap}
.search .q{flex:1 1 220px;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;min-width:0}
.search input{border:0;background:none;padding:10px 0;width:100%;outline:none;color:var(--pill-fg)}
.search select{border:0;background:var(--pill-sunk);border-radius:99px;padding:10px 12px;flex:0 1 180px;min-width:0;color:var(--pill-fg)}
.hero .trust{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px;font-size:13px;color:var(--hero-muted)}
.hero .trust span{display:flex;align-items:center;gap:6px}

/* ---------- Historias: en línea ahora ---------- */
.stories{display:flex;gap:14px;overflow-x:auto;padding:18px 2px 6px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;flex:none;font-size:12px;font-weight:600}
.story .ring{width:70px;height:70px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,var(--c),var(--aji),var(--c));position:relative}
.story .ring>span{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;border:3px solid var(--bg)}
.story .ring svg{width:100%;height:100%;display:block}
.story .live{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);background:var(--online);color:#fff;font-style:normal;font-size:8.5px;font-weight:800;letter-spacing:.05em;padding:0 6px;line-height:15px;border-radius:99px;border:2px solid var(--bg);white-space:nowrap}
.story b{max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}

/* ---------- Categorías ---------- */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cat{position:relative;overflow:hidden;text-align:left;border:0;border-radius:var(--r);padding:16px;min-height:132px;background:var(--cs);color:var(--fg);display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.cat .ic{position:absolute;top:14px;right:14px;width:48px;height:48px;border-radius:14px;background:var(--c);color:var(--surface);display:grid;place-items:center;transform:rotate(-6deg);transition:transform .2s}
.cat .ic svg{width:26px;height:26px}
.cat:hover .ic{transform:rotate(0) scale(1.06)}
.cat b{font-family:var(--font-display);font-size:19px}
.cat span{font-size:13px;color:var(--muted)}
.cat[aria-pressed="true"]{outline:2.5px solid var(--c);outline-offset:-2.5px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* ---------- Ranking ---------- */
.rank{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.rk{flex:0 0 250px;scroll-snap-align:start;position:relative;border:0;text-align:left;background:var(--surface);border-radius:var(--r);padding:16px 16px 16px 64px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;overflow:hidden}
.rk .num{position:absolute;left:8px;top:50%;transform:translateY(-52%);font-family:var(--font-display);font-weight:800;font-size:78px;line-height:1;color:transparent;-webkit-text-stroke:2px var(--c);opacity:.85}
.rk .av{width:54px;height:54px}
.rk b{display:block;font-size:15px}
.rk small{color:var(--muted);font-size:12px}

/* ---------- Tarjetas ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;transition:transform .18s, box-shadow .18s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card .cover{height:86px;background:radial-gradient(circle at 85% 20%,color-mix(in srgb,var(--c) 45%,transparent) 0 30%,transparent 31%),var(--cs);position:relative}
.card .cover .pattern{position:absolute;inset:0;opacity:.35;background-image:radial-gradient(var(--c) 1.2px,transparent 1.4px);background-size:14px 14px;mask-image:linear-gradient(90deg,transparent,#000)}
.card .avw{position:absolute;left:16px;top:42px;width:78px;height:78px;border-radius:50%;border:4px solid var(--surface);overflow:hidden;background:var(--surface)}
.card .avw svg{width:100%;height:100%;display:block}
.on-dot{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--online);border:3px solid var(--surface)}
.card .on-dot{left:76px;top:102px;z-index:2}
.card .body{padding:44px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .nm{display:flex;align-items:center;gap:5px;font-weight:800;font-size:16px}
.card .nm svg{color:var(--c-tutoria)}
.card .sub{font-size:13px;color:var(--muted)}
.card h3{font-size:16px;font-weight:600;font-family:var(--font-body);letter-spacing:0;line-height:1.35}
.card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line)}
.price{font-family:var(--font-display);font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.price small{font-family:var(--font-body);font-size:12px;color:var(--muted);font-weight:600}
.stars{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.stars b{color:var(--fg)}
.stars svg{color:var(--aji);width:16px;height:16px}
.heart{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(6px);display:grid;place-items:center;color:var(--muted);z-index:2}
.heart[aria-pressed="true"]{color:var(--c-compania)}
.heart[aria-pressed="true"] svg{fill:currentColor;animation:pop .35s}
@keyframes pop{50%{transform:scale(1.35)}}
.ribbon{position:absolute;top:10px;left:10px;z-index:2;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--aji);color:var(--aji-ink)}
.ribbon.boost{background:var(--c-compania);color:#fff}

/* Niveles */
.lvl{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:3px 9px 3px 6px;border-radius:99px;white-space:nowrap}
.lvl svg{width:14px;height:14px}
.lvl.nuevo{background:var(--sunk);color:var(--muted)}
.lvl.confiable{background:var(--ok-soft);color:var(--ok)}
.lvl.destacado{background:var(--morado-soft);color:var(--morado)}
.lvl.oro{background:linear-gradient(135deg,var(--gold-1),var(--gold-2));color:#3A2600}
.lvl.pendiente{background:var(--warn-soft);color:var(--warn)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--fg)}
.bdg svg{width:13px;height:13px;color:var(--c,var(--morado))}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.m{background:var(--morado-soft);color:var(--morado)}

/* ---------- Botones ---------- */
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;background:var(--morado);color:var(--on-morado);text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:var(--sunk);color:var(--fg)}
.btn.aji{background:var(--aji);color:var(--aji-ink)}
.btn.line{background:none;border:1.5px solid var(--line);color:var(--fg)}
.btn.wa{background:#1FA855;color:#fff}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.big{padding:15px 22px;font-size:16px;border-radius:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--morado);font-weight:700;text-decoration:underline}

/* ---------- Descubrir (swipe) ---------- */
.deck-wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.deck{position:relative;width:min(400px,100%);height:min(600px,68vh);min-height:470px}
.dcard{position:absolute;inset:0;background:var(--surface);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;touch-action:pan-y;user-select:none;transition:transform .3s ease}
.dcard.drag{transition:none}
.dcard .top{flex:0 0 56%;position:relative;background:var(--cs);display:grid;place-items:center;overflow:hidden}
.dcard .top .pattern{position:absolute;inset:0;background-image:radial-gradient(var(--c) 1.4px,transparent 1.6px);background-size:16px 16px;opacity:.3}
.dcard .top .big{width:62%;max-width:230px;aspect-ratio:1;border-radius:50%;overflow:hidden;border:6px solid var(--surface);position:relative;z-index:1}
.dcard .top .big svg{width:100%;height:100%;display:block}
.dcard .info{padding:16px 20px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.dcard .info h2{font-size:26px}
.dcard .info p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stamp{position:absolute;top:28px;z-index:3;font-family:var(--font-display);font-weight:800;font-size:30px;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;letter-spacing:.04em}
.stamp.save{left:22px;color:var(--online);transform:rotate(-14deg)}
.stamp.pass{right:22px;color:var(--c-compania);transform:rotate(14deg)}
.deck-actions{display:flex;gap:18px;align-items:center}
.round{width:62px;height:62px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .15s}
.round:hover{transform:scale(1.08)}
.round svg{width:28px;height:28px}
.round.pass{color:var(--c-compania)}
.round.save{color:var(--online)}
.round.go{width:76px;height:76px;background:var(--morado);color:var(--on-morado)}
.round.go svg{width:32px;height:32px}
.deck-hint{font-size:13px;color:var(--muted)}

/* ---------- Hoja de perfil ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:26px 26px 0 0;position:relative;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:26px}}
.sheet .pad{padding:20px max(20px,env(safe-area-inset-right,0px)) 20px max(20px,env(safe-area-inset-left,0px))}
.x{position:absolute;top:14px;right:14px;z-index:3;background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(6px);border:0;border-radius:50%;width:38px;height:38px;font-size:20px;display:grid;place-items:center}
.pcover{height:150px;background:radial-gradient(circle at 80% 30%,color-mix(in srgb,var(--c) 50%,transparent) 0 25%,transparent 26%),radial-gradient(circle at 15% 90%,color-mix(in srgb,var(--aji) 60%,transparent) 0 18%,transparent 19%),var(--cs);position:relative}
.pcover .pattern{position:absolute;inset:0;background-image:radial-gradient(var(--c) 1.3px,transparent 1.5px);background-size:16px 16px;opacity:.3}
.phead{display:flex;gap:16px;align-items:flex-end;margin-top:-62px;position:relative;flex-wrap:wrap}
.phead .avw{width:118px;height:118px;border-radius:50%;border:5px solid var(--bg);overflow:hidden;background:var(--surface);flex:none;position:relative}
.phead .avw svg{width:100%;height:100%;display:block}
.phead .on-dot{right:6px;bottom:6px;width:22px;height:22px}
.phead h2{font-size:28px;display:flex;align-items:center;gap:8px}
.phead h2 svg{color:var(--c-tutoria);width:22px;height:22px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 4px}
.stat-row div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat-row b{display:block;font-family:var(--font-display);font-size:20px;font-variant-numeric:tabular-nums}
.stat-row span{font-size:11.5px;color:var(--muted)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.block h4{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.extras{display:flex;flex-direction:column;gap:6px}
.extras div{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-variant-numeric:tabular-nums}

// Avatares dibujados (SVG) generados a partir de una semilla. Sin fotos reales.
(function () {
  const SKIN = ['#F3CFB1', '#E6B48E', '#D29A70', '#B87B52', '#9A623F', '#7A4B30'];
  const HAIR = ['#1E1512', '#2E1D14', '#4A2F1E', '#6B4428', '#1B1B22'];
  const GRAY = ['#B9B4AE', '#D4D0CA', '#9C9690'];
  const BG = ['#EADFF3', '#FBE7B5', '#D7EDE8', '#F7D9D2', '#DCE4F7', '#E9E3D5'];
  const SHIRT = ['#5A2A82', '#B0413E', '#1F6F78', '#C28A12', '#3B5BA5', '#2F7A4D', '#7A3E65', '#444055'];
  const INK = '#2A1E2F';

  function rng(seed) {
    let a = (seed * 2654435761) >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    const f = c => Math.max(0, Math.min(255, Math.round(c * k)));
    return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(c => c.toString(16).padStart(2, '0')).join('');
  }

  // p: { seed, g: 'f'|'m'|'x', age }
  window.avatarSVG = function (p) {
    const r = rng(p.seed || 1);
    const g = p.g === 'x' ? (r() < .5 ? 'f' : 'm') : (p.g || 'x');
    const old = (p.age || 30) >= 55;
    const skin = pick(r, SKIN), skinD = shade(skin, .86);
    const hair = old ? pick(r, GRAY) : pick(r, HAIR);
    const bg = pick(r, BG), shirt = pick(r, SHIRT);
    const styles = g === 'f' ? ['long', 'bob', 'bun', 'curlyL', 'pony'] : (old ? ['bald', 'short', 'side'] : ['short', 'side', 'curly', 'buzz', 'quiff']);
    const style = pick(r, styles);
    const glasses = r() < (old ? .65 : .25);
    const beard = g === 'm' && r() < .35;
    const earring = g === 'f' && r() < .5;
    const smile = r();

    let back = '', front = '';
    switch (style) {
      case 'long': back = `<path d="M17 31c-2-13 4-20 15-20s17 7 15 20l2 19H15z" fill="${hair}"/>`;
        front = `<path d="M19.5 29c0-10 5-16 12.5-16s12.5 6 12.5 16c-5-1-10-5-12-10-2 5-8 9-13 10z" fill="${hair}"/>`; break;
      case 'bob': back = `<path d="M17.5 36c-3-15 3-23 14.5-23s17.5 8 14.5 23z" fill="${hair}"/>`;

      case 'bun': back = `<circle cx="32" cy="11.5" r="5.5" fill="${hair}"/>`;
        front = `<path d="M20 27c0-9 5-14 12-14s12 5 12 14c-3-4-7-6-12-6s-9 2-12 6z" fill="${hair}"/>`; break;
      case 'pony': back = `<path d="M43 20c6 2 8 9 6 18-1-6-4-9-7-10z" fill="${hair}"/>`;
        front = `<path d="M20 27c0-9 5-14 12-14s12 5 12 14c-4-3-8-5-13-5-4 0-8 2-11 5z" fill="${hair}"/>`; break;
      case 'curlyL': back = [[18, 26], [17, 34], [19, 42], [46, 26], [47, 34], [45, 42]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="5" fill="${hair}"/>`).join('');
        front = [[21, 20], [26, 15], [32, 13.5], [38, 15], [43, 20]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="5.2" fill="${hair}"/>`).join(''); break;
      case 'curly': front = [[21, 21], [25, 16], [31, 14], [37, 15], [42, 19], [44, 24]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="4.4" fill="${hair}"/>`).join(''); break;
      case 'short': front = `<path d="M20 26c0-9 5-14 12-14s12 5 12 14c-2-4-6-6-12-6s-10 2-12 6z" fill="${hair}"/>`; break;
      case 'side': front = `<path d="M20 27c-1-10 6-15 13-15 7 0 12 5 11 14-3-5-9-7-14-5-4 1-8 3-10 6z" fill="${hair}"/>`; break;
      case 'quiff': front = `<path d="M20 26c0-8 4-13 10-14 3-3 9-3 12 1 3 3 2 8 2 13-3-4-7-6-12-6s-10 2-12 6z" fill="${hair}"/>`; break;
      case 'buzz': front = `<path d="M21 24c1-7 5-11 11-11s10 4 11 11c-3-3-7-4-11-4s-8 1-11 4z" fill="${hair}" opacity=".9"/>`; break;
      case 'bald': front = `<path d="M19.6 31c-.3-4 .6-7 2.4-8.5V31zM44.4 31c.3-4-.6-7-2.4-8.5V31z" fill="${hair}"/>`; break;
    }
    const mouth = smile < .5 ? `<path d="M28.5 35.5q3.5 3 7 0" stroke="${INK}" stroke-width="1.5" fill="none" stroke-linecap="round"/>`
      : smile < .8 ? `<path d="M28 35q4 4.5 8 0z" fill="#fff" stroke="${INK}" stroke-width="1.2" stroke-linejoin="round"/>`
      : `<path d="M29 36h6" stroke="${INK}" stroke-width="1.5" stroke-linecap="round"/>`;
    const beardSvg = beard ? `<path d="M20.5 30c0 8 5 12.5 11.5 12.5S43.5 38 43.5 30c-1.5 3-3 4-5 4.3-1.5-1.6-4-2.3-6.5-2.3s-5 .7-6.5 2.3c-2-.3-3.5-1.3-5-4.3z" fill="${hair}"/>` : '';

        ${front}${beardSvg}

// Yunta · biometría en el navegador.
// - Lee el DNI con tesseract.js (OCR).
// - Detecta el rostro, hace la prueba de vida (parpadeo y giro) y compara la selfie con la foto del DNI
//   usando Human (github.com/vladmandic/human, licencia MIT).
// Esto da una decisión preliminar y guía al usuario. La decisión confiable la toma el servidor
// (verificador.py con DeepFace), porque lo que corre en el celular se puede manipular.
(function () {
  const C = window.YUNTA_CONFIG.BIOMETRIA;
  let human = null, humanLoading = null, tessLoading = null;

  function loadScript(src) {
    return new Promise((res, rej) => {
      if ([...document.scripts].some(s => s.src === src)) return res();
      const s = document.createElement('script'); s.src = src; s.async = true;
      s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar ' + src)); document.head.appendChild(s);
    });
  }

  async function getHuman() {
    if (human) return human;
    if (!humanLoading) humanLoading = (async () => {
      await loadScript(C.HUMAN_URL);
      const h = new window.Human.Human({
        modelBasePath: C.HUMAN_MODELS,
        debug: false,
        cacheSensitivity: 0,
        face: {
          enabled: true,
          detector: { rotation: true, maxDetected: 1, minConfidence: 0.3 },
          mesh: { enabled: true }, iris: { enabled: true },
          description: { enabled: true }, emotion: { enabled: false },
          antispoof: { enabled: true }, liveness: { enabled: true }
        },
        body: { enabled: false }, hand: { enabled: false }, object: { enabled: false },
        segmentation: { enabled: false }, gesture: { enabled: true }
      });
      await h.load(); await h.warmup();
      human = h; return h;
    })();
    return humanLoading;
  }

  const imgFrom = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

  function similarity(a, b) {
    if (!a || !b) return 0;
    if (human && human.match && human.match.similarity) return human.match.similarity(a, b);
    if (human && human.similarity) return human.similarity(a, b);
    let dot = 0, na = 0, nb = 0;
    for (let i = 0; i < a.length; i++) { dot += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
    return Math.max(0, dot / Math.sqrt(na * nb));
  }

  // ---------- OCR del DNI ----------
  async function ocrDNI(dataUrl, dniEsperado, nombreEsperado) {
    if (!tessLoading) tessLoading = loadScript(C.TESSERACT_URL);
    await tessLoading;
    const { data } = await window.Tesseract.recognize(dataUrl, 'spa');
    const text = (data && data.text) || '';
    const nums = [...text.replace(/[Oo]/g, '0').matchAll(/(?<!\d)(\d{8})(?!\d)/g)].map(m => m[1]);
    const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
    const T = norm(text);
    const palabras = norm(nombreEsperado || '').split(/\s+/).filter(w => w.length > 2);
    const nombreOk = palabras.length ? palabras.filter(w => T.includes(w)).length / palabras.length : 0;
    return { dniLeido: nums[0] || null, dniOk: !!dniEsperado && nums.includes(dniEsperado), nombreOk: nombreOk >= 0.5, texto: text.slice(0, 400) };
  }

  // ---------- Rostro en una foto (DNI o selfie subida) ----------
  async function rostroDeFoto(dataUrl) {
    const h = await getHuman();
    const img = await imgFrom(dataUrl);
    const r = await h.detect(img);
    const f = r.face && r.face[0];
    if (!f || !f.embedding || !f.embedding.length) return null;
    return { embedding: Array.from(f.embedding), real: f.real ?? null, live: f.live ?? null, score: f.score ?? f.boxScore ?? null };
  }

  // ---------- Escaneo en vivo con desafíos ----------
  // onStep({paso, texto, hecho}) actualiza la interfaz. Devuelve la selfie y las medidas.
  async function escaneoEnVivo(video, onStep, signal) {
    const h = await getHuman();
    const pasos = [
      { id: 'frente', texto: 'Mira al frente, con la cara dentro del óvalo' },
      { id: 'parpadeo', texto: 'Parpadea' },
      { id: 'izquierda', texto: 'Gira la cabeza a la izquierda' },
      { id: 'derecha', texto: 'Ahora a la derecha' },
      { id: 'final', texto: 'Mira al frente otra vez' }
    ];
    let i = 0; const reales = [], vivos = []; let selfie = null, embedding = null, frenteOk = 0;
    const t0 = Date.now();
    onStep({ paso: pasos[0].id, texto: pasos[0].texto, i: 0, total: pasos.length });
    while (i < pasos.length) {
      if (signal && signal.aborted) throw new Error('Escaneo cancelado');
      if (Date.now() - t0 > C.TIEMPO_MAX_MS) throw new Error('Se acabó el tiempo. Busca más luz e intenta otra vez.');
      const r = await h.detect(video);
      const f = r.face && r.face[0];
      if (!f) { onStep({ paso: pasos[i].id, texto: 'No vemos tu rostro. ' + pasos[i].texto, i, total: pasos.length }); await new Promise(z => setTimeout(z, 120)); continue; }
      if (typeof f.real === 'number') reales.push(f.real);
      if (typeof f.live === 'number') vivos.push(f.live);
      const yaw = (f.rotation && f.rotation.angle && f.rotation.angle.yaw) || 0;
      const gestos = (r.gesture || []).map(g => g.gesture || '');
      const p = pasos[i].id;
      let cumple = false;
      if (p === 'frente' || p === 'final') { cumple = Math.abs(yaw) < 0.18 && (++frenteOk > 4); }
      if (p === 'parpadeo') cumple = gestos.some(g => /blink/.test(g));
      if (p === 'izquierda') cumple = yaw > 0.35 || gestos.some(g => /facing left/.test(g));
      if (p === 'derecha') cumple = yaw < -0.35 || gestos.some(g => /facing right/.test(g));
      if (cumple) {
        if (p === 'final') {
          const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight;
          c.getContext('2d').drawImage(video, 0, 0); selfie = c.toDataURL('image/jpeg', 0.9);
          embedding = Array.from(f.embedding || []);
        }
        onStep({ paso: p, texto: pasos[i].texto, i, total: pasos.length, hecho: true });
        i++; frenteOk = 0;
        if (i < pasos.length) onStep({ paso: pasos[i].id, texto: pasos[i].texto, i, total: pasos.length });
      }
      await new Promise(z => setTimeout(z, 60));
    }
    const prom = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
    return { selfie, embedding, real: prom(reales), live: prom(vivos), desafios: true };
  }

  // Decisión preliminar en el navegador
  function decidir({ ocr, parecido, vivo }) {
    const motivos = [];
    if (!ocr || !ocr.dniOk) motivos.push('No pudimos leer tu número de DNI en la foto');
    if (!vivo || !vivo.desafios) motivos.push('Falta la prueba de vida con cámara');
    else {
      if (vivo.real != null && vivo.real < C.ANTISPOOF_MIN) motivos.push('La imagen podría ser una foto o una pantalla');
      if (vivo.live != null && vivo.live < C.VIVO_MIN) motivos.push('La prueba de vida no fue clara');
    }
    if (parecido == null) motivos.push('No encontramos tu rostro en la foto del DNI');
    else if (parecido < C.PARECIDO_MIN) motivos.push('Tu selfie no se parece lo suficiente a la foto del DNI');
    const decision = motivos.length ? (parecido != null && parecido < C.PARECIDO_RECHAZO ? 'rechazado' : 'revision') : 'aprobado';
    return { decision, motivos };
  }

  async function camaraDisponible() {
    try { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && window.isSecureContext; } catch (e) { return false; }
  }

  window.BIO = { getHuman, ocrDNI, rostroDeFoto, escaneoEnVivo, similarity, decidir, camaraDisponible };
})();

const waLink = (num, s) => `https://wa.me/51${String(num).replace(/\D/g,'').slice(-9)}?text=${encodeURIComponent(`Hola ${s.name.replace(/^(Ps\.|Lic\.|Don)\s/,'').split(' ')[0]}, te vi en Yunta (${s.sub}). ¿Tienes disponibilidad?`)}`;
function drawCta(s, ct){
  const box = $('#cta'); if (!box) return;
  if (ct.unlocked) {
    box.innerHTML = `<div class="contact-open grow"><span class="lbl">WhatsApp de ${esc(s.name.split(' ')[0])}</span><span class="num">${esc(ct.whatsapp)}</span><span class="note" style="overflow-wrap:anywhere">${esc(ct.email)}</span></div>

    $('#safe').onclick = () => citaSegura(s);
    $('#rv').onclick = () => calificar(s);
    return;
  }
  const cr = S.wallet.credits || 0;
  box.innerHTML = `<div class="grow"><span class="price">S/ ${s.price}<small> /${esc(s.unit)}</small></span><br><span class="note">${I('lock')} WhatsApp ${esc(ct.whatsapp)}</span></div>
    ${!S.user ? `<button class="btn big" id="unl">${I('key')} Ingresa para ver su contacto</button>` :
      cr > 0 ? `<button class="btn big aji" id="unl">${I('key')} Ver WhatsApp · usa 1 de tus ${cr}</button>` :
      `<button class="btn big" id="unl">${I('key')} Elegir un plan para ver su contacto</button>`}`;
  $('#unl').onclick = run(async () => {
    if (!requireLogin(() => perfil(s), 'Inicia sesión para ver contactos')) return;
    if (!(S.wallet.credits > 0)) { close(); go('planes'); toast('Te quedaste sin contactos. Elige un plan.'); return; }
    const r = await API.unlock(s.providerId);
    if (r === 'ok') { S.wallet = await API.wallet(); renderNav(); confetti(); toast('¡Contacto desbloqueado!'); drawCta(s, await API.getContact(s.providerId)); }
    else if (r === 'sin_creditos') { close(); go('planes'); }
    else if (r === 'reputacion') toast(`Tu nota como cliente está bajo ${C.CLIENTE_NOTA_MIN}. No puedes contactar servicios de Compañía por ahora.`);
    else requireLogin(() => perfil(s));
  });
}

function starPicker(id, init = 5){ return `<div class="starpick" id="${id}" data-v="${init}">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" class="${n<=init?'on':''}" aria-label="${n} estrellas">${I('star')}</button>`).join('')}</div>`; }
function bindStars(id){ const el = $('#'+id); el.querySelectorAll('button').forEach(b => b.onclick = () => { el.dataset.v = b.dataset.n; el.querySelectorAll('button').forEach(x => x.classList.toggle('on', +x.dataset.n <= +b.dataset.n)); }); }
function bindTags(id){ $('#'+id).querySelectorAll('button').forEach(b => b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true')); }
const pickedTags = id => [...$('#'+id).querySelectorAll('[aria-pressed="true"]')].map(b => b.dataset.t);

// ---------------- Descubrir (swipe) ----------------
VIEWS.descubrir = async function(){
  S.services = await API.listServices();
  drawDeck();
};
function drawDeck(){
  const pool = S.services.filter(s => s.active && !S.seen.has(s.id) && (!S.cat || s.cat === S.cat)).sort((a,b) => score(b) - score(a));
  $('#app').innerHTML = `<div class="deck-wrap"><div style="text-align:center"><h1 style="font-size:30px">Descubrir</h1><p class="lead" style="margin:4px 0 0">Desliza a la derecha para guardar, a la izquierda para pasar.</p></div>
    <div class="chips" style="justify-content:center">${[{id:'',name:'Todo'},...CATS].map(k=>`<button class="chip" data-dc="${k.id}" aria-pressed="${(S.cat||'')===k.id}">${k.name}</button>`).join('')}</div>
    <div class="deck" id="deck">${pool.length ? pool.slice(0,3).reverse().map((s,i,arr)=>deckCard(s, i === arr.length-1)).join('') : `<div class="empty" style="position:absolute;inset:0;display:grid;place-items:center">Viste a todos por ahora.<br><br><button class="btn" id="again">Volver a empezar</button></div>`}</div>
    ${pool.length?`<div class="deck-actions"><button class="round pass" id="bp" aria-label="Pasar">${I('x')}</button><button class="round go" id="bg" aria-label="Ver perfil">${I('key')}</button><button class="round save" id="bs" aria-label="Guardar">${I('heart')}</button></div>
    <span class="deck-hint">Usa ← y → del teclado</span>`:''}</div>`;
  $$('[data-dc]').forEach(b => b.onclick = () => { S.cat = b.dataset.dc || null; drawDeck(); });
  const ag = $('#again'); if (ag) ag.onclick = () => { S.seen.clear(); drawDeck(); };
  if (!pool.length) return;
  const top = $('#deck .dcard:last-child'); const s = pool[0];
  const decide = run(async dir => {
    top.style.transform = `translateX(${dir*130}%) rotate(${dir*22}deg)`; top.style.opacity = 0;
    S.seen.add(s.id);
    if (dir > 0 && S.user && !S.favs.includes(s.id)) { await API.toggleFavorite(s.id); S.favs = await API.favorites(); renderNav(); toast(`${s.name.split(' ')[0]} guardado`); }
    else if (dir > 0 && !S.user) toast('Ingresa para guardar tus favoritos');
    setTimeout(drawDeck, 260);
  });
  $('#bp').onclick = () => decide(-1); $('#bs').onclick = () => decide(1); $('#bg').onclick = () => perfil(s);
  document.onkeydown = e => { if (S.view !== 'descubrir' || $('#modal').innerHTML) return; if (e.key === 'ArrowLeft') decide(-1); if (e.key === 'ArrowRight') decide(1); };
  let x0 = null, dx = 0;
  top.onpointerdown = e => { x0 = e.clientX; dx = 0; top.classList.add('drag'); top.setPointerCapture(e.pointerId); };
  top.onpointermove = e => { if (x0 === null) return; dx = e.clientX - x0; top.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`;
    top.querySelector('.stamp.save').style.opacity = Math.max(0, dx/120); top.querySelector('.stamp.pass').style.opacity = Math.max(0, -dx/120); };
  top.onpointerup = () => { top.classList.remove('drag'); if (Math.abs(dx) > 110) decide(Math.sign(dx)); else { top.style.transform = ''; top.querySelectorAll('.stamp').forEach(x => x.style.opacity = 0); if (Math.abs(dx) < 6) perfil(s); } x0 = null; };
}
function deckCard(s, isTop){
  const c = catOf(s.cat);
  return `<div class="dcard" data-cat="${s.cat}" style="${isTop?'':'transform:scale(.95) translateY(14px);filter:brightness(.97)'}">
    <span class="stamp save">GUARDAR</span><span class="stamp pass">PASAR</span>
    <div class="top"><div class="pattern"></div><span class="big">${avatar(s)}</span></div>
    <div class="info"><div style="display:flex;gap:6px;flex-wrap:wrap">${lvlBadge(nivel(s))}${s.online?'<span class="pill ok">En línea</span>':''}<span class="pill">${esc(c.name)}</span></div>
      <h2>${esc(s.name.split(' ').slice(0,2).join(' '))}, ${s.age}</h2>
      <span class="note">${esc(s.sub)} · ${esc(s.dist)} · S/ ${s.price}/${esc(s.unit)} · ${I('star')} ${s.rating.toFixed(1)}</span>
      <p>${esc(s.title)}. ${esc(s.desc)}</p></div></div>`;
}

const METODO_TXT = { yape_codigo: 'Yape con código', qr: 'QR Yape o Plin', manual: 'Código de operación' };
let payPoll = null;
function comprar(p, serviceId){
  const metodos = (C.PAGOS && C.PAGOS.METODOS) || ['manual'];
  let actual = metodos[0];
  openModal(`<div class="pad"><h2 style="font-size:22px;margin-right:40px">${esc(p.nombre)} · ${soles(p.precio)}</h2>
    <p class="note">${p.contactos ? `${p.contactos} ${p.contactos===1?'contacto':'contactos'}${p.periodo?' cada mes':''}` : esc(p.desc)}</p>
    ${metodos.length > 1 ? `<div class="seg seg${metodos.length}" style="margin-top:10px">${metodos.map(m=>`<button type="button" data-m="${m}" aria-pressed="${m===actual}">${METODO_TXT[m]}</button>`).join('')}</div>` : ''}
    <div id="paybox" style="margin-top:14px"></div></div>`);
  const draw = () => { clearInterval(payPoll); ({ yape_codigo: pagoCodigo, qr: pagoQR, manual: pagoManual })[actual](p, serviceId); };
  $$('[data-m]').forEach(b => b.onclick = () => { actual = b.dataset.m; $$('[data-m]').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
  draw();
}
async function pagoExitoso(){ clearInterval(payPoll); close(); S.wallet = await API.wallet(); renderNav(); confetti(); toast('¡Pago confirmado!'); if (['planes','cuenta'].includes(S.view)) render(); }
function pagoCodigo(p, serviceId){
  $('#paybox').innerHTML = `<ol class="paysteps"><li>Abre Yape y entra al menú.</li><li>Toca <b>Código de aprobación</b> y copia los 6 dígitos.</li><li>Escríbelos aquí: vence en 2 minutos.</li></ol>

    <p class="note" style="margin-top:8px">El pago se confirma al instante. Máximo S/ 2,000 por pago.${API.mode==='demo'?' Demo: cualquier código funciona menos 000000.':''}</p>`;
  $('#ypay').onclick = run(async () => {
    const cel = $('#yc').value.replace(/\s/g,''), cod = $('#yo').value.trim();
    if (!/^9\d{8}$/.test(cel)) return toast('Escribe tu celular de 9 dígitos');
    if (!/^\d{6}$/.test(cod)) return toast('El código de aprobación tiene 6 dígitos');

  });

function pagoQR(p, serviceId){

function drawQR(size = 84){ const c = $('#qr'); if (!c) return; const x = c.getContext('2d'); const u = size / 21; x.fillStyle = '#fff'; x.fillRect(0,0,size,size); x.fillStyle = '#231A2B';
  let seed = Math.random()*1e6; const r = () => (seed = (seed*9301+49297) % 233280) / 233280;
  for (let i=0;i<21;i++) for (let j=0;j<21;j++){ const f=(i<7&&j<7)||(i<7&&j>13)||(i>13&&j<7);
    if (f){ const a=i%14,b=j%14; if(a===0||a===6||b===0||b===6||(a>1&&a<5&&b>1&&b<5)) x.fillRect(j*u,i*u,u,u); } else if (r()>.52) x.fillRect(j*u,i*u,u,u); } }

  $('#f-selfie').onchange = run(async e => { const f = e.target.files[0]; if (!f) return; data.selfieUrl = await readFile(f);

  $('#f-cul').onchange = run(async e => { const f = e.target.files[0]; if (!f) return; if (f.size > 8e6) return toast('El archivo pesa más de 8 MB'); data.culFileUrl = await readFile(f); $('#t-cul').textContent = f.name.slice(0,14); mark('st3', true);

    if (!$('#vok').checked) return toast('Debes autorizar el tratamiento de tus datos');
    const auto = data.auto || { decision: 'revision', motivos: ['Sin análisis automático'] };
    await API.submitVerification({ ...data, vivo: undefined, dniFace: undefined, name: $('#vn').value.trim(), dni, culNumero: $('#vcn').value.trim(), culFecha: fecha, whatsapp: $('#vw').value.trim(), colegiatura: $('#vcol').value.trim(),
      auto: { decision: auto.decision, motivos: auto.motivos, parecido: data.parecido ?? null, real: data.vivo ? data.vivo.real : null, live: data.vivo ? data.vivo.live : null, desafios: !!(data.vivo && data.vivo.desafios), ocrDni: data.ocr ? data.ocr.dniLeido : null, checkedBy: 'navegador' } });

  });

let camStream = null;
function stopCam(){ if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; } }
function escanear(onDone){
  const ctl = new AbortController();
  openModal(`<div class="pad"><h2 style="font-size:22px;margin-right:40px">${I('face')} Escaneo de rostro</h2>
    <div class="cam"><video id="cam" playsinline muted autoplay></video><div class="oval"></div><div class="cam-msg" id="cam-msg">Cargando la cámara…</div></div>
    <div class="live" id="cam-steps"><span>Frente</span><span>Parpadea</span><span>Izquierda</span><span>Derecha</span><span>Frente</span></div>
    <p class="note" style="text-align:center">Buena luz, sin lentes de sol ni gorra. El video no se guarda: solo una foto final.</p>
    <button class="btn ghost" id="cam-x" style="width:100%">Cancelar</button></div>`);
  $('#cam-x').onclick = () => { ctl.abort(); close(); };
  (async () => {
    try {
      if (!(await BIO.camaraDisponible())) throw new Error('Este navegador no permite usar la cámara. Sube una selfie.');
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
      const v = $('#cam'); v.srcObject = camStream; await v.play();
      $('#cam-msg').textContent = 'Preparando el reconocimiento…';
      await BIO.getHuman();
      const res = await BIO.escaneoEnVivo(v, st => { const m = $('#cam-msg'); if (!m) return; m.textContent = st.texto; $$('#cam-steps span').forEach((x, k) => x.classList.toggle('on', k < st.i + (st.hecho ? 1 : 0))); }, ctl.signal);
      close(); onDone(res); toast('Prueba de vida completada');
    } catch (e) { if (ctl.signal.aborted) return; const m = $('#cam-msg'); if (m) m.textContent = e.message || 'No se pudo usar la cámara'; else toast(e.message); stopCam(); }
  })();
}

    <button class="btn big" id="go" style="width:100%;margin-top:14px">Empezar cita segura</button></div>`, s.cat);
  $('#go').onclick = run(async () => {
    if (!$('#sn').value.trim() || !/^9\d{8}$/.test($('#sp').value.replace(/\s/g,''))) return toast('Ingresa el nombre y celular de tu contacto de confianza');
    trusted({ name: $('#sn').value.trim(), phone: $('#sp').value.trim() });
    S.safety = await API.startSafety({ providerId: s.providerId, provider: s.name, trustedName: $('#sn').value.trim(), trustedPhone: $('#sp').value.trim(), place: $('#sl').value.trim(), minutes: +$('#sd').value });
    close(); drawSafety(); toast(`Avisamos a ${S.safety.trustedName} que empezó tu cita`);
  });
}
let safeTimer;
function drawSafety(){
  clearInterval(safeTimer);
  const s = S.safety; const el = $('#safebar');
  if (!s) { el.hidden = true; return; }
  el.hidden = false;
  const tick = () => {
    const left = s.started + s.minutes * 60e3 - Date.now();
    const t = Math.abs(left); const h = Math.floor(t/36e5), m = Math.floor(t%36e5/6e4), sec = Math.floor(t%6e4/1e3);
    el.innerHTML = `<span class="t">${left<0?'+':''}${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}</span>
      <span class="grow">Cita con <b>${esc(s.provider.split(' ')[0])}</b> · ${left<0?'¡Se pasó la hora! Marca que estás bien.':'Te cuidamos con '+esc(s.trustedName)}</span>
      <button class="btn sm" id="ok">Terminé bien</button><button class="btn sm" id="fc">${I('phone')} Llamada</button><button class="btn sm sos" id="sos">SOS</button>`;
    $('#ok').onclick = run(async () => { await API.endSafety(); S.safety = null; drawSafety(); toast(`Avisamos a ${s.trustedName} que terminaste bien`); });
    $('#fc').onclick = () => { toast('Te llamamos en 5 segundos…'); setTimeout(fakeCall, 5000); };
    $('#sos').onclick = sos;
  };
  tick(); safeTimer = setInterval(tick, 1000);
}
function fakeCall(){
  const who = (S.safety && S.safety.trustedName) || 'Mamá';
  const el = document.createElement('div'); el.className = 'call'; el.setAttribute('role','dialog');
  el.innerHTML = `<div class="who"><span class="note" style="color:rgba(255,255,255,.7)">Llamada entrante…</span><div class="pulse">${esc(who[0].toUpperCase())}</div><h2>${esc(who)}</h2><span style="color:rgba(255,255,255,.7)">celular</span></div>
    <div class="acts"><button class="no" aria-label="Rechazar">${I('phone')}</button><button class="yes" aria-label="Contestar">${I('phone')}</button></div>`;
  document.body.appendChild(el);
  el.querySelector('.no').onclick = () => el.remove();
  el.querySelector('.yes').onclick = () => { let t = 0; const w = el.querySelector('.who span:last-child'); const iv = setInterval(() => { t++; w.textContent = `00:${String(t).padStart(2,'0')}`; }, 1000);
    el.querySelector('.acts').innerHTML = `<button class="no" aria-label="Colgar">${I('phone')}</button>`; el.querySelector('.no').onclick = () => { clearInterval(iv); el.remove(); }; };
}
function sos(){
  const s = S.safety;
  openModal(`<div class="pad"><h2 style="font-size:24px;color:var(--bad)">${I('sos')} ¿Estás en peligro?</h2>
    <p>Llama ahora a la <b>Policía: 105</b>. Para violencia: <b>Línea 100</b>.</p>
    <div class="alert bad">En la app real, esto envía tu ubicación en vivo a ${esc(s?s.trustedName:'tu contacto de confianza')} y al equipo de Yunta, y queda registrado.</div>
    <div class="row" style="margin-top:12px"><button class="btn big" id="cp105">${I('copy')} Copiar 105</button><button class="btn big ghost" id="cl">Estoy a salvo</button></div></div>`);
  $('#cp105').onclick = async () => { try { await navigator.clipboard.writeText('105'); toast('105 copiado'); } catch (e) { toast('Marca 105 desde tu teléfono'); } };
  $('#cl').onclick = close;
}

// ---------------- Confeti ----------------
function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.createElement('canvas'); cv.className = 'confetti'; document.body.appendChild(cv);
  const ctx = cv.getContext('2d'); const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cs = getComputedStyle(document.documentElement); const cols = ['--aji','--morado','--c-compania','--c-tutoria','--c-salud'].map(v => cs.getPropertyValue(v).trim());
  const ps = Array.from({length: 140}, () => ({ x: W/2, y: H*0.55, vx: (Math.random()-.5)*14, vy: -Math.random()*15-5, r: Math.random()*6+3, c: cols[Math.floor(Math.random()*cols.length)], a: Math.random()*6 }));
  let f = 0; (function step(){ ctx.clearRect(0,0,W,H); ps.forEach(p => { p.vy += .45; p.x += p.vx; p.y += p.vy; p.a += .2; ctx.fillStyle = p.c; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6); ctx.restore(); });
    if (++f < 90) requestAnimationFrame(step); else cv.remove(); })();
}
