<title>Yunta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — sticky top bar, content column (max 1100px), bottom tab bar on phones */
:root{
  --bg:#FBF8F4; --surface:#FFFFFF; --sunk:#F2ECE5; --line:#E4DCD2;
  --fg:#231A2B; --muted:#6E6274;
  --morado:#5A2A82; --morado-soft:#EFE6F6; --on-morado:#FFFFFF; --aji:#F2B705; --aji-ink:#4A3600;
  --ok:#1F7A4D; --ok-soft:#E2F3EA; --warn:#9A5B00; --warn-soft:#FCEFD6; --bad:#B3261E; --bad-soft:#FBE3E1;
  --scrim:rgba(20,10,30,.5);
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17121C; --surface:#211A28; --sunk:#2A2232; --line:#3A3043; --fg:#F3EEF6; --muted:#B4A8BC;
  --morado:#C9A2EC; --morado-soft:#352645; --on-morado:#1B1022; --aji:#F5C431; --aji-ink:#2A1F00;
  --ok:#6FD3A0; --ok-soft:#1D3328; --warn:#F2B866; --warn-soft:#3A2C15; --bad:#FF9C94; --bad-soft:#3D1F1D;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17121C; --surface:#211A28; --sunk:#2A2232; --line:#3A3043; --fg:#F3EEF6; --muted:#B4A8BC;
  --morado:#C9A2EC; --morado-soft:#352645; --on-morado:#1B1022; --aji:#F5C431; --aji-ink:#2A1F00;
  --ok:#6FD3A0; --ok-soft:#1D3328; --warn:#F2B866; --warn-soft:#3A2C15; --bad:#FF9C94; --bad-soft:#3D1F1D;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--morado);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--morado);letter-spacing:-.02em;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--aji);display:inline-block}
.demo{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--aji);color:var(--aji-ink);padding:3px 8px;border-radius:99px}
nav.tabs{margin-left:auto;display:flex;gap:4px;align-items:center}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:10px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
nav.tabs button[aria-current="true"]{background:var(--morado-soft);color:var(--morado)}
nav.tabs .badge{background:var(--morado);color:var(--on-morado);border-radius:99px;font-size:11px;padding:0 6px}
nav.tabs .me{width:26px;height:26px;border-radius:50%;overflow:hidden;display:inline-block;flex:none}

main{padding-block:24px 110px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:end;margin-bottom:24px}
.hero h1{font-size:clamp(30px,5vw,50px);font-weight:800;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--morado);background:linear-gradient(transparent 62%,var(--aji) 62%,var(--aji) 90%,transparent 90%)}
.hero p{color:var(--muted);max-width:52ch;margin:12px 0 0}
.search{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:90px;resize:vertical}

.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.cat{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px}
.cat b{font-family:var(--font-display);font-size:17px}
.cat span{color:var(--muted);font-size:13px}
.cat svg{width:26px;height:26px;color:var(--morado);margin-bottom:4px}
.cat[aria-pressed="true"]{border-color:var(--morado);background:var(--morado-soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.chip{white-space:nowrap;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.count{color:var(--muted);font-size:13px;margin:0 0 12px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left}
.card:hover{border-color:var(--morado)}
.card .star{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--aji);color:var(--aji-ink);padding:2px 8px;border-radius:99px}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.av{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none;display:block}
.av svg{width:100%;height:100%;display:block}
.av.lg{width:72px;height:72px}
.who b{display:block;font-size:15px}
.who small{color:var(--muted)}
.card h3{font-size:17px;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;font-weight:600;border-radius:99px;padding:2px 8px;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.m{background:var(--morado-soft);color:var(--morado)}
.foot{display:flex;justify-content:space-between;align-items:baseline;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line)}
.price{font-family:var(--font-display);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.price small{font-family:var(--font-body);font-size:12px;color:var(--muted);font-weight:500}
.stars{font-size:13px;color:var(--muted)}
.stars b{color:var(--fg)}

.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--morado);color:var(--on-morado);text-align:center}
.btn.ghost{background:var(--sunk);color:var(--fg)}
.btn.aji{background:var(--aji);color:var(--aji-ink)}
.btn.line{background:none;border:1px solid var(--line);color:var(--fg)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--morado);font-weight:600;text-decoration:underline}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.x{background:var(--sunk);border:0;border-radius:50%;width:34px;height:34px;font-size:18px;flex:none}
.section{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;display:flex;flex-direction:column;gap:10px}
.section h4{margin:0;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{width:auto;margin-top:3px}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.sum .t{font-weight:800;font-size:17px;border-top:1px solid var(--line);padding-top:6px}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pay button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-weight:700}
.pay button[aria-pressed="true"]{border-color:var(--morado);background:var(--morado-soft);color:var(--morado)}
.qr{display:flex;gap:14px;align-items:center;background:var(--sunk);border-radius:12px;padding:12px}
.qr canvas{width:84px;height:84px;border-radius:8px;background:#fff;flex:none}
.note{font-size:13px;color:var(--muted)}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.reviews{display:flex;flex-direction:column;gap:8px}
.rev{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px}
.rev small{color:var(--muted)}

/* Contacto bloqueado */
.lock{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.lock .kv{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;font-variant-numeric:tabular-nums}
.lock .kv span:nth-child(3n+1){color:var(--muted);font-size:13px}
.lock .kv b{font-size:16px;letter-spacing:.02em}
.lock.open{border-color:var(--ok);background:var(--ok-soft)}
.blur{filter:blur(.5px);color:var(--muted)}

/* Páginas */
.page{max-width:780px}
.page h1{font-size:32px;margin-bottom:6px}
.lead{color:var(--muted);margin:0 0 20px}
.form{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-weight:600;font-size:14px}
.list{display:flex;flex-direction:column;gap:10px}
.bk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bk .info{flex:1 1 220px;min-width:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.rules{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.rule h3{font-size:16px;margin-bottom:4px}
.rule p{margin:0;color:var(--muted);font-size:14px}
.sos{display:flex;gap:12px;align-items:center;background:var(--morado);color:var(--on-morado);border-radius:var(--r);padding:16px;margin-top:16px;flex-wrap:wrap}
.sos p{margin:0;flex:1 1 240px}

/* Login */
.auth{max-width:440px;margin:0 auto}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:13px;font-weight:600}
.quick .av{width:40px;height:40px}

/* Verificación: pasos */
.steps{display:flex;flex-direction:column;gap:0;counter-reset:s}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-weight:800;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.step.done .n{background:var(--ok);color:var(--surface)}
.step h3{font-size:16px;margin-bottom:2px}
.step .body{display:flex;flex-direction:column;gap:10px;min-width:0}
.upl{display:flex;gap:12px;align-items:center;border:1px dashed var(--line);border-radius:12px;padding:10px;background:var(--bg);flex-wrap:wrap}
.upl .thumb{width:72px;height:72px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--muted);font-size:11px;text-align:center}
.upl .thumb img{width:100%;height:100%;object-fit:cover}
.upl input[type=file]{flex:1 1 180px;border:0;background:none;padding:0}
.face{position:relative;width:150px;height:190px;border-radius:50%/42%;border:3px dashed var(--morado);display:grid;place-items:center;overflow:hidden;background:var(--sunk);margin:4px auto}
.face img{width:100%;height:100%;object-fit:cover}
.face .hint{font-size:12px;color:var(--muted);text-align:center;padding:12px}
.live{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.live span{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);font-weight:600}
.live span.on{background:var(--ok-soft);color:var(--ok)}

/* Admin */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cmp figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12px;color:var(--muted);min-width:0}
.cmp .ph{width:100%;aspect-ratio:3/4;max-width:120px;border-radius:10px;overflow:hidden;background:var(--sunk);display:grid;place-items:center}
.cmp .ph svg,.cmp .ph img{width:100%;height:100%;object-fit:cover}
.cul{font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;background:var(--sunk);border-radius:10px;padding:10px 12px;font-variant-numeric:tabular-nums}
.cul span:nth-child(odd){color:var(--muted)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%}

footer.legal{border-top:1px solid var(--line);margin-top:32px;padding-top:16px;font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
footer.legal button{font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-weight:600;max-width:90vw}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .cats{grid-template-columns:repeat(2,1fr)}
  .rules{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:6}
  nav.tabs button{font-size:12px;padding:8px 4px;flex:1;justify-content:center}
}
@media (max-width:420px){.cmp{grid-template-columns:repeat(3,1fr);gap:6px}.quick{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

</style>

<header class="top"><div class="wrap">
  <button class="logo" id="home" aria-label="Yunta, inicio"><i></i>yunta</button>
  <span class="demo" id="modeTag">Demo</span>
  <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
</div></header>
<main class="wrap" id="app"></main>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
// Configuración de Yunta.
// Deja SUPABASE_URL vacío para usar el MODO DEMO (datos de ejemplo en el navegador).
// Para usar la base real: Supabase → Project Settings → API → copia URL y "anon public key".
window.YUNTA_CONFIG = {
  SUPABASE_URL: '',
  SUPABASE_ANON_KEY: '',

  // Monetización (soles)
  PRECIO_DESBLOQUEO: 5,                 // ver el contacto de 1 persona
  PAQUETE: { creditos: 5, precio: 19 }, // paquete de desbloqueos
  PRECIO_DESTACADO: 15,                 // anuncio destacado por 7 días (lo paga el proveedor)
  COMISION_RESERVA: 0.10,               // 10% al reservar con pago protegido

  // Cuenta que recibe los Yape/Plin (mientras no haya pasarela)
  YAPE_NUMERO: '999 000 111',
  YAPE_TITULAR: 'Yunta Servicios',

  CUL_VIGENCIA_DIAS: 90,
  PUNTAJE_ROSTRO_MIN: 0.85
};

// Avatares dibujados (SVG) generados a partir de una semilla. Sin fotos reales.
(function () {
  const SKIN = ['#F3CFB1', '#E6B48E', '#D29A70', '#B87B52', '#9A623F', '#7A4B30'];
  const HAIR = ['#1E1512', '#2E1D14', '#4A2F1E', '#6B4428', '#1B1B22'];
  const GRAY = ['#B9B4AE', '#D4D0CA', '#9C9690'];
  const BG = ['#EADFF3', '#FBE7B5', '#D7EDE8', '#F7D9D2', '#DCE4F7', '#E9E3D5'];
  const SHIRT = ['#5A2A82', '#B0413E', '#1F6F78', '#C28A12', '#3B5BA5', '#2F7A4D', '#7A3E65', '#444055'];
  const INK = '#2A1E2F';

  function rng(seed) {
    let a = (seed * 2654435761) >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    const f = c => Math.max(0, Math.min(255, Math.round(c * k)));
    return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(c => c.toString(16).padStart(2, '0')).join('');
  }

  // p: { seed, g: 'f'|'m'|'x', age }
  window.avatarSVG = function (p) {
    const r = rng(p.seed || 1);
    const g = p.g === 'x' ? (r() < .5 ? 'f' : 'm') : (p.g || 'x');
    const old = (p.age || 30) >= 55;
    const skin = pick(r, SKIN), skinD = shade(skin, .86);
    const hair = old ? pick(r, GRAY) : pick(r, HAIR);
    const bg = pick(r, BG), shirt = pick(r, SHIRT);
    const styles = g === 'f' ? ['long', 'bob', 'bun', 'curlyL', 'pony'] : (old ? ['bald', 'short', 'side'] : ['short', 'side', 'curly', 'buzz', 'quiff']);
    const style = pick(r, styles);
    const glasses = r() < (old ? .65 : .25);
    const beard = g === 'm' && r() < .35;
    const earring = g === 'f' && r() < .5;
    const smile = r();

    let back = '', front = '';
    switch (style) {
      case 'long': back = `<path d="M17 31c-2-13 4-20 15-20s17 7 15 20l2 19H15z" fill="${hair}"/>`;
        front = `<path d="M19.5 29c0-10 5-16 12.5-16s12.5 6 12.5 16c-5-1-10-5-12-10-2 5-8 9-13 10z" fill="${hair}"/>`; break;
      case 'bob': back = `<path d="M17.5 36c-3-15 3-23 14.5-23s17.5 8 14.5 23z" fill="${hair}"/>`;
        front = `<path d="M19.5 28c0-9 5.5-15 12.5-15s12.5 6 12.5 15c-6 0-14-2-18-7-2 3-4 6-7 7z" fill="${hair}"/>`; break;

    <div class="section"><h4>Reseñas</h4><div class="reviews">${API.reviews(s.providerId).map(r=>`<div class="rev">"${esc(r[1])}"<br><small>${esc(r[0])}</small></div>`).join('') || '<span class="note">Aún sin reseñas.</span>'}</div></div>

      <span class="price">S/ ${s.price}<small> /${esc(s.unit)}</small></span>
      <button class="btn" id="res">Reservar con pago protegido</button></div>`);
  $('#res').onclick = () => { if (requireLogin(() => reservar(s))) reservar(s); };

async function drawContact(s){
  const box = $('#contact'); if (!box) return;
  const ct = await API.getContact(s.providerId);
  const cr = await API.credits();
  if (!$('#contact')) return;
  if (ct.unlocked) {
    box.innerHTML = `<div class="lock open"><div class="kv">
      <span>WhatsApp</span><b>${esc(ct.whatsapp)}</b><button class="btn sm ghost" data-copy="${esc(ct.whatsapp)}">Copiar</button>
      <span>Correo</span><b style="font-size:14px;overflow-wrap:anywhere">${esc(ct.email)}</b><button class="btn sm ghost" data-copy="${esc(ct.email)}">Copiar</button></div>
      <span class="note">Contacto desbloqueado. Si pagas por fuera de Yunta, el pago no queda protegido.</span></div>`;
    box.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); toast('Copiado'); } catch (e) { toast('Selecciona el texto para copiarlo'); } });
    return;
  }
  box.innerHTML = `<div class="lock"><div class="kv">
      <span>WhatsApp</span><b class="blur">${esc(ct.whatsapp)}</b><span></span>
      <span>Correo</span><b class="blur" style="font-size:14px">${esc(ct.email)}</b><span></span></div>
    ${ct.pending ? `<div class="alert">Recibimos tu pago. Lo estamos verificando y te mostramos el contacto en unos minutos.</div>` :
    `<div class="row">
      <button class="btn aji" id="unl">Ver contacto · S/ ${C.PRECIO_DESBLOQUEO}</button>
      ${cr > 0 ? `<button class="btn line" id="cred">Usar 1 crédito (tienes ${cr})</button>` : `<button class="btn line" id="pack">${C.PAQUETE.creditos} contactos · S/ ${C.PAQUETE.precio}</button>`}</div>
    <span class="note">Pago único por persona. Así sabemos que quien escribe va en serio y protegemos a quien publica.</span>`}</div>`;
  const u = $('#unl'); if (u) u.onclick = () => { if (requireLogin(() => perfil(s), 'Inicia sesión para ver el contacto')) pagar({ concepto: `Ver contacto de ${s.name}`, monto: C.PRECIO_DESBLOQUEO, onPaid: run(async (m) => { await API.requestUnlock(s.providerId, m); if (API.mode === 'demo') { toast('Pago recibido. Verificando…'); await perfil(s); setTimeout(run(async () => { const ul = (await API.pendingUnlocks()).find(x => x.providerId === s.providerId); if (ul) await API.confirmUnlock(ul.id); toast('Pago verificado. Contacto desbloqueado.'); drawContact(s); }), 1600); } else perfil(s); }) }); };
  const k = $('#cred'); if (k) k.onclick = run(async () => { if (await API.unlockWithCredit(s.providerId)) { toast('Usaste 1 crédito'); drawContact(s); } });
  const p = $('#pack'); if (p) p.onclick = () => { if (requireLogin(() => perfil(s))) pagar({ concepto: `Paquete de ${C.PAQUETE.creditos} contactos`, monto: C.PAQUETE.precio, onPaid: run(async (m) => { await API.buyPack(m); toast(`Tienes ${C.PAQUETE.creditos} créditos`); perfil(s); }) }); };
}

// ---------------- Pago Yape/Plin (reutilizable) ----------------
function pagar({ concepto, monto, onPaid }){
  let method = 'yape';
  openModal(`<header><div><h2 style="font-size:20px">Pagar ${soles(monto)}</h2><span class="note">${esc(concepto)}</span></div><button class="x" aria-label="Cerrar">×</button></header>
    <div class="pay"><button data-p="yape" aria-pressed="true">Yape</button><button data-p="plin" aria-pressed="false">Plin</button></div>
    <div class="qr" style="margin-top:10px"><canvas id="qr" width="84" height="84"></canvas><div><b id="pnum">Yape a ${esc(C.YAPE_TITULAR)}</b><br><span class="note">Número: ${esc(C.YAPE_NUMERO)}${API.mode==='demo'?' (demo)':''}. Escanea o yapea al número y copia el código de operación.</span></div></div>
    <div class="field" style="margin-top:10px"><label for="op">Código de operación</label><input id="op" inputmode="numeric" placeholder="Ej. 04821937" autocomplete="off"></div>
    <button class="btn" id="paid" style="width:100%;margin-top:12px">Ya pagué</button>`);
  drawQR();
  $$('.pay button').forEach(b => b.onclick = () => { method = b.dataset.p; $$('.pay button').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#pnum').textContent = (method==='yape'?'Yape':'Plin') + ' a ' + C.YAPE_TITULAR; drawQR(); });
  $('#paid').onclick = () => { const op = $('#op').value.trim(); if (!/^\d{6,12}$/.test(op)) { toast('El código de operación tiene entre 6 y 12 dígitos'); $('#op').focus(); return; } onPaid({ method, op }); };
}
function drawQR(){ const c = $('#qr'); if (!c) return; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,84,84); x.fillStyle = '#231A2B';
  let seed = Math.random()*1e6; const r = () => (seed = (seed*9301+49297) % 233280) / 233280;
  for (let i=0;i<21;i++) for (let j=0;j<21;j++){ const f=(i<7&&j<7)||(i<7&&j>13)||(i>13&&j<7);
    if (f){ const a=i%14,b=j%14; if(a===0||a===6||b===0||b===6||(a>1&&a<5&&b>1&&b<5)) x.fillRect(j*4,i*4,4,4); } else if (r()>.52) x.fillRect(j*4,i*4,4,4); } }

// ---------------- Reservar ----------------
function reservar(s){
  const t = new Date(); t.setDate(t.getDate()+2); const d = t.toISOString().slice(0,10);
  const porHora = s.unit === 'hora'; const social = s.cat === 'compania';
  openModal(`<header><h2 style="font-size:20px">Reservar con ${esc(s.name)}</h2><button class="x" aria-label="Cerrar">×</button></header>
  <div class="row"><div class="field"><label for="f">Fecha</label><input type="date" id="f" value="${d}"></div>
    <div class="field"><label for="h">Hora</label><input type="time" id="h" value="16:00"></div>
    ${porHora ? `<div class="field"><label for="dur">Horas</label><select id="dur">${[1,2,3,4,5,6].map(n=>`<option ${n===2?'selected':''}>${n}</option>`).join('')}</select></div>` : ''}</div>
  <div class="field" style="margin-top:10px"><label for="lug">${social?'Punto de encuentro (lugar público)':s.dist==='Online'?'Enlace o plataforma':'Dirección'}</label>
    <input id="lug" placeholder="${social?'Ej. Larcomar, entrada principal':s.dist==='Online'?'Google Meet / Zoom':'Av., calle, número, referencia'}"></div>
  <div class="field" style="margin-top:10px"><label for="det">Detalles</label><textarea id="det" placeholder="Cuéntale qué necesitas"></textarea></div>
  ${social ? `<label class="check" style="margin-top:10px"><input type="checkbox" id="ok1"> Acepto que es compañía social, sin contacto íntimo, y que el primer encuentro será en un lugar público.</label>` : ''}
  <div class="section"><h4>Resumen</h4><div class="sum" id="sum"></div></div>
  <button class="btn" id="go" style="width:100%;margin-top:12px">Continuar al pago</button>`);
  const calc = () => { const h = porHora ? +$('#dur').value : 1; const sub = s.price*h; const fee = Math.round(sub*C.COMISION_RESERVA*100)/100;
    $('#sum').innerHTML = `<span>S/ ${s.price} × ${h} ${esc(s.unit)}${h>1?'s':''}</span><span>${soles(sub)}</span><span>Tarifa de servicio (${C.COMISION_RESERVA*100}%)</span><span>${soles(fee)}</span><span class="t">Total</span><span class="t">${soles(sub+fee)}</span>`; return { h, sub, fee }; };
  calc(); if (porHora) $('#dur').onchange = calc;
  $('#go').onclick = () => {
    if (social && !$('#ok1').checked) { toast('Marca la casilla de compañía social para continuar'); return; }
    if (!$('#lug').value.trim()) { toast('Indica el lugar o enlace del servicio'); $('#lug').focus(); return; }
    const { h, sub, fee } = calc(); const b = { serviceId: s.id, providerId: s.providerId, name: s.name, seed: s.seed, g: s.g, age: s.age, title: s.sub, date: $('#f').value, time: $('#h').value, h, lug: $('#lug').value.trim(), det: $('#det').value.trim(), subtotal: sub, fee, total: sub+fee };
    pagar({ concepto: `Reserva con ${s.name}`, monto: sub+fee, onPaid: run(async (m) => { await API.createBooking({ ...b, pay: m.method, op: m.op }); toast('Reserva enviada. Verificamos tu pago en unos minutos.'); go('reservas'); }) });
  };
}

    <div class="row"><div class="field"><label for="rn">Nombre</label><input id="rn" required></div><div class="field"><label for="rd">DNI</label><input id="rd" required maxlength="8"></div></div>
